            border-color: #ef4444 !important;

        }
        .disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }

        let questions = [];
        const blocks = rawData.split(/(?=Câu\s*\d+:)/);

        blocks.forEach((block) => {
            if (!block.trim() || !block.includes('✅')) return;

            const qMatch = block.match(/(Câu\s*\d+:.*?)(?=\nA\.)/s);
            const aMatch = block.match(/A\.\s*(.*?)(?=\nB\.)/s);
            const bMatch = block.match(/B\.\s*(.*?)(?=\nC\.)/s);
            const cMatch = block.match(/C\.\s*(.*?)(?=\nD\.)/s);
            const dMatch = block.match(/D\.\s*(.*?)(?=\n✅)/s);
            const ansMatch = block.match(/✅ Đáp án đúng:\s*([A-D])/);
            const basisMatch = block.match(/📚 Căn cứ pháp lý:\s*(.*)/);

            if (qMatch && aMatch && bMatch && cMatch && dMatch && ansMatch) {
                questions.push({
                    question: qMatch[1].trim(),
                    options: {
                        'A': aMatch[1].trim(),
                        'B': bMatch[1].trim(),
                        'C': cMatch[1].trim(),
                        'D': dMatch[1].trim()
                    },
                    correctAnswer: ansMatch[1].trim(),
                    basis: basisMatch ? basisMatch[1].trim() : ""
                });
            }
        });

        let currentIndex = 0;
        let userAnswers = {}; // Lưu trữ: userAnswers[index] = 'A'/'B'/'C'/'D'

        // Thuật toán xáo trộn mảng ngẫu nhiên (Fisher-Yates)
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // Xáo trộn ngẫu nhiên mỗi khi tải trang
        shuffleArray(questions);

        function renderQuestion() {
            const q = questions[currentIndex];
            
            // Cập nhật tiến trình
            document.getElementById('progress-text').textContent = `Câu ${currentIndex + 1} / ${questions.length}`;
            
            // Cập nhật câu hỏi
            document.getElementById('question-text').textContent = q.question;

            // Render đáp án
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            const answered = userAnswers[currentIndex]; // Đã trả lời chưa?

            for (const [key, value] of Object.entries(q.options)) {
                const btn = document.createElement('button');
                btn.className = `option-btn w-full text-left p-4 rounded-xl border-2 border-gray-200 font-medium text-gray-700 bg-white`;
                btn.innerHTML = `<span class="font-bold mr-2 text-blue-600">${key}.</span> ${value}`;
                
                if (answered) {
                    // Nếu câu này đã từng trả lời
                    btn.disabled = true;
                    btn.classList.add('disabled');
                    if (key === q.correctAnswer) {
                        btn.classList.add('correct'); // Luôn hiện màu xanh cho đáp án đúng
                    }
                    if (key === answered && answered !== q.correctAnswer) {
                        btn.classList.add('incorrect'); // Hiện màu đỏ nếu người dùng chọn sai
                    }
                } else {
                    // Nếu chưa trả lời thì gắn sự kiện click
                    btn.onclick = () => selectAnswer(key);
                }
                
                optionsContainer.appendChild(btn);
            }

            // Hiển thị hoặc ẩn căn cứ pháp lý
            const basisContainer = document.getElementById('basis-container');
            if (answered) {
                document.getElementById('basis-text').textContent = q.basis;
                basisContainer.classList.remove('hidden');
            } else {
                basisContainer.classList.add('hidden');
            }

            // Cập nhật trạng thái nút điều hướng
            document.getElementById('prev-btn').disabled = currentIndex === 0;
            document.getElementById('next-btn').disabled = currentIndex === questions.length - 1;
        }

        function selectAnswer(selectedKey) {
            const q = questions[currentIndex];
            userAnswers[currentIndex] = selectedKey; // Lưu lại trạng thái
            
            // Giao diện: Cập nhật lại ngay lập tức
            renderQuestion();
        }

        function nextQuestion() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                renderQuestion();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        }

        // Bắt đầu ứng dụng
        renderQuestion();
    </script>
